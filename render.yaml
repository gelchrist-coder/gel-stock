services:
  - type: web
    name: gel-stock-api
    runtime: php
    plan: free
    startCommand: php -S 0.0.0.0:$PORT
    healthCheckPath: /api/test.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gel-stock-db
          property: connectionString
      - key: CORS_ENABLED
        value: "true"
      - key: API_MODE
        value: production

databases:
  - name: gel-stock-db
    engine: postgresql
    version: "15"
    plan: free
    databaseName: gel_stock
