<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEL-STOCK Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .admin-key-input {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-refresh {
            background: #10b981;
            color: white;
        }

        .btn-refresh:hover {
            background: #059669;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            color: #666;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-form {
            margin-bottom: 20px;
        }

        .modal-form label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .modal-form input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .modal-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-footer .btn {
            flex: 1;
            max-width: 150px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .stat-card.users {
            border-left-color: #667eea;
        }

        .stat-card.products {
            border-left-color: #f59e0b;
        }

        .stat-card.sales {
            border-left-color: #10b981;
        }

        .stat-card.revenue {
            border-left-color: #ef4444;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .stat-change {
            font-size: 12px;
            color: #10b981;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #6b7280;
        }

        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        table tbody tr:hover {
            background: #f9fafb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #dc2626;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #22c55e;
            margin-bottom: 20px;
        }

        .chart-container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #6b7280;
        }

        .metric-value {
            font-weight: 600;
            color: #333;
        }

        .btn-delete-user {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-delete-user:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Change Admin Key Modal -->
    <div id="changeKeyModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeChangeKeyModal()">&times;</button>
            <div class="modal-header">
                <i class="fas fa-key"></i>
                Change Admin Key
            </div>
            <form id="changeKeyForm" class="modal-form" onsubmit="submitKeyChange(event)">
                <label for="currentAdminKey">Current Admin Key (for verification)</label>
                <input 
                    type="password" 
                    id="currentAdminKey" 
                    name="currentAdminKey" 
                    placeholder="Enter your current admin key" 
                    required
                />
                
                <label for="newAdminKey" style="margin-top: 15px;">New Admin Key (minimum 6 characters)</label>
                <input 
                    type="password" 
                    id="newAdminKey" 
                    name="newAdminKey" 
                    placeholder="Enter new admin key" 
                    minlength="6" 
                    required
                />
                
                <label for="confirmAdminKey" style="margin-top: 15px;">Confirm New Admin Key</label>
                <input 
                    type="password" 
                    id="confirmAdminKey" 
                    name="confirmAdminKey" 
                    placeholder="Confirm new admin key" 
                    minlength="6" 
                    required
                />
                
                <div id="changeKeyResult"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeChangeKeyModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Change Key</button>
                </div>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-chart-bar"></i>
                GEL-STOCK Admin Dashboard
            </h1>
            <p style="color: #666; margin-bottom: 15px;">System-wide analytics and user management</p>
            
            <div class="header-controls">
                <button class="btn btn-primary" onclick="loadStats()">
                    <i class="fas fa-sync-alt"></i> Refresh Dashboard
                </button>
                <button class="btn btn-primary" onclick="openChangeKeyModal()">
                    <i class="fas fa-key"></i> Change Admin Key
                </button>
                <button class="btn btn-secondary" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <div id="content"></div>
    </div>

    <script>
        const API_BASE = '../api/';

        // Check if user is authenticated on page load
        window.addEventListener('load', function() {
            const adminKey = sessionStorage.getItem('adminKey');
            if (!adminKey) {
                window.location.href = 'index.html';
                return;
            }
            // Auto-load stats when page loads
            loadStats();
        });

        async function loadStats() {
            const adminKey = sessionStorage.getItem('adminKey');
            const content = document.getElementById('content');

            if (!adminKey) {
                content.innerHTML = '<div class="error"><i class="fas fa-lock"></i> Please log in first</div>';
                window.location.href = 'index.html';
                return;
            }

            content.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading statistics...</div>';

            try {
                const response = await fetch(`${API_BASE}admin_stats.php?type=all&adminKey=${encodeURIComponent(adminKey)}`);
                
                if (!response.ok) {
                    content.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> API Error: ${response.status} ${response.statusText}</div>`;
                    return;
                }
                
                const result = await response.json();
                
                console.log('API Response:', result);

                if (!result || !result.success) {
                    content.innerHTML = `<div class="error"><i class="fas fa-lock"></i> ${result?.message || 'Unknown error'}</div>`;
                    return;
                }

                displayStats(result.data);
            } catch (error) {
                console.error('Error:', error);
                content.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> Error: ${error.message}</div>`;
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('adminKey');
                window.location.href = 'index.html';
            }
        }

        function openChangeKeyModal() {
            document.getElementById('changeKeyModal').classList.add('active');
            document.getElementById('changeKeyForm').reset();
            document.getElementById('changeKeyResult').innerHTML = '';
        }

        function closeChangeKeyModal() {
            document.getElementById('changeKeyModal').classList.remove('active');
            document.getElementById('changeKeyForm').reset();
            document.getElementById('changeKeyResult').innerHTML = '';
        }

        async function submitKeyChange(event) {
            event.preventDefault();
            
            const currentAdminKey = document.getElementById('currentAdminKey').value.trim();
            const newAdminKey = document.getElementById('newAdminKey').value.trim();
            const confirmAdminKey = document.getElementById('confirmAdminKey').value.trim();
            const resultDiv = document.getElementById('changeKeyResult');
            
            // Validate current key
            if (!currentAdminKey) {
                resultDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> Please enter your current admin key</div>';
                return;
            }

            // Validate new key length
            if (newAdminKey.length < 6) {
                resultDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> New admin key must be at least 6 characters</div>';
                return;
            }

            // Verify new key matches confirmation
            if (newAdminKey !== confirmAdminKey) {
                resultDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> New keys do not match. Please try again.</div>';
                return;
            }

            // Prevent using same key
            if (currentAdminKey === newAdminKey) {
                resultDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> New key must be different from the current key</div>';
                return;
            }

            try {
                resultDiv.innerHTML = '<div style="color: #666;"><i class="fas fa-spinner fa-spin"></i> Verifying current key and processing...</div>';
                
                const response = await fetch(`${API_BASE}admin_key.php`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        adminKey: currentAdminKey,
                        newKey: newAdminKey
                    })
                });

                const result = await response.json();

                if (result.success) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <i class="fas fa-check-circle"></i> Key change instructions:
                        </div>
                        <div style="background: #f3f4f6; padding: 15px; border-radius: 5px; margin-top: 10px; font-size: 13px; line-height: 1.6;">
                            <strong>Option 1 (Recommended - Environment Variable):</strong>
                            <p style="margin: 8px 0;">Set the environment variable in your system:</p>
                            <code style="background: white; padding: 8px; border-radius: 3px; display: block; word-break: break-all;">GEL_STOCK_ADMIN_KEY=${result.new_key}</code>
                            
                            <strong style="margin-top: 15px; display: block;">Option 2 (Direct Edit):</strong>
                            <p style="margin: 8px 0;">Edit <code>api/config.php</code> and change:</p>
                            <code style="background: white; padding: 8px; border-radius: 3px; display: block;">define('ADMIN_KEY', '${result.new_key}');</code>
                            
                            <strong style="margin-top: 15px; display: block;">⚠️ Next Steps:</strong>
                            <p style="margin: 8px 0;">1. Implement the change using Option 1 or Option 2 above</p>
                            <p style="margin: 8px 0;">2. Click "Logout" to exit the dashboard</p>
                            <p style="margin: 8px 0;">3. Login again with your new admin key</p>
                        </div>
                    `;
                    
                    // Auto-logout after 5 seconds so user must use new key
                    setTimeout(() => {
                        alert('Key change registered! You will be logged out to ensure the new key is used.');
                        logout();
                    }, 5000);
                } else {
                    resultDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> ${result.message || 'Failed to process key change - current key may be incorrect'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> Error: ${error.message}</div>`;
            }
        }

        function displayStats(data) {
            let html = '<div class="success"><i class="fas fa-check-circle"></i> Dashboard loaded successfully</div>';

            // User Statistics
            if (data.users) {
                html += `
                    <div class="stats-grid">
                        <div class="stat-card users">
                            <div class="stat-label"><i class="fas fa-users"></i> Total Users</div>
                            <div class="stat-value">${data.users.total_users}</div>
                            <div class="stat-change">
                                <i class="fas fa-arrow-up"></i> ${data.users.registered_today} today
                            </div>
                        </div>
                        <div class="stat-card products">
                            <div class="stat-label"><i class="fas fa-box"></i> Total Products</div>
                            <div class="stat-value">${data.products ? data.products.total_products : 0}</div>
                            <div class="stat-change">
                                Inventory value: GHS ${(data.products ? data.products.total_inventory_value : 0).toLocaleString()}
                            </div>
                        </div>
                        <div class="stat-card sales">
                            <div class="stat-label"><i class="fas fa-shopping-cart"></i> Total Sales</div>
                            <div class="stat-value">${data.sales ? data.sales.total_sales : 0}</div>
                            <div class="stat-change">
                                Avg order: GHS ${(data.sales ? data.sales.average_order_value : 0).toLocaleString()}
                            </div>
                        </div>
                        <div class="stat-card revenue">
                            <div class="stat-label"><i class="fas fa-money-bill-wave"></i> Total Revenue</div>
                            <div class="stat-value">GHS ${(data.revenue ? data.revenue.total_revenue : 0).toLocaleString()}</div>
                            <div class="stat-change">
                                Today: GHS ${(data.revenue ? data.revenue.revenue_today : 0).toLocaleString()}
                            </div>
                        </div>
                    </div>
                `;

                // Recent Registrations
                html += `
                    <div class="section">
                        <h2><i class="fas fa-user-plus"></i> Recent Registrations (Last 100)</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Phone</th>
                                    <th>Email</th>
                                    <th>Registered</th>
                                    <th>Last Login</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.users.recent_registrations.forEach(user => {
                    const regDate = new Date(user.created_at).toLocaleDateString();
                    const lastLogin = user.last_login ? new Date(user.last_login).toLocaleDateString() : 'Never';
                    html += `
                        <tr>
                            <td>${user.name}</td>
                            <td><strong>${user.phone}</strong></td>
                            <td>${user.email}</td>
                            <td>${regDate}</td>
                            <td>${lastLogin}</td>
                            <td><button class="btn-delete-user" onclick="deleteUser('${user.phone}', '${user.name}')" title="Delete user and all associated data"><i class="fas fa-trash-alt"></i> Delete</button></td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // Sales Statistics
            if (data.sales && data.sales.sales_by_payment_method) {
                html += `
                    <div class="section">
                        <h2><i class="fas fa-credit-card"></i> Sales by Payment Method</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Payment Method</th>
                                    <th>Number of Sales</th>
                                    <th>Total Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.sales.sales_by_payment_method.forEach(method => {
                    html += `
                        <tr>
                            <td><strong>${method.payment_method.toUpperCase()}</strong></td>
                            <td>${method.count}</td>
                            <td>GHS ${parseFloat(method.total).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // Products by Category
            if (data.products && data.products.products_by_category) {
                html += `
                    <div class="section">
                        <h2><i class="fas fa-tags"></i> Products by Category</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th>Number of Products</th>
                                    <th>Total Stock</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.products.products_by_category.forEach(cat => {
                    html += `
                        <tr>
                            <td><strong>${cat.category}</strong></td>
                            <td>${cat.count}</td>
                            <td>${cat.total_stock} units</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // Top Products
            if (data.products && data.products.top_products) {
                html += `
                    <div class="section">
                        <h2><i class="fas fa-fire"></i> Top 10 Popular Products</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Product Name</th>
                                    <th>SKU</th>
                                    <th>Users with this Product</th>
                                    <th>Avg Stock</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.products.top_products.forEach(product => {
                    const avgStock = (product.stock_quantity / product.users_with_product).toFixed(0);
                    html += `
                        <tr>
                            <td><strong>${product.product_name}</strong></td>
                            <td>${product.sku}</td>
                            <td>${product.users_with_product} users</td>
                            <td>${avgStock} units</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // Activity Statistics
            if (data.activity) {
                html += `
                    <div class="section">
                        <h2><i class="fas fa-chart-line"></i> System Activity (Last 24 Hours)</h2>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-users-cog"></i> Active Users</span>
                            <span class="metric-value">${data.activity.users_active_last_24h}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-plus-square"></i> Product Adders</span>
                            <span class="metric-value">${data.activity.product_adders_24h}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-cash-register"></i> Sellers</span>
                            <span class="metric-value">${data.activity.sellers_24h}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-user-friends"></i> New Users (Week)</span>
                            <span class="metric-value">${data.activity.new_users_last_week}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-user-friends"></i> New Users (Month)</span>
                            <span class="metric-value">${data.activity.new_users_last_month}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-database"></i> Database Size</span>
                            <span class="metric-value">${data.activity.database_size_mb} MB</span>
                        </div>
                    </div>
                `;
            }

            document.getElementById('content').innerHTML = html;
        }

        // Delete user function
        async function deleteUser(phone, name) {
            if (!confirm(`Are you sure you want to delete ${name} (${phone}) and ALL their associated data?\n\nThis cannot be undone!`)) {
                return;
            }

            try {
                const adminKey = sessionStorage.getItem('adminKey');
                const response = await fetch(`${API_BASE}admin_stats.php?phone=${encodeURIComponent(phone)}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        adminKey: adminKey,
                        phone: phone
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`✓ User ${name} deleted successfully!`);
                    loadStats(); // Reload dashboard
                } else {
                    alert(`✗ Error: ${result.message}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert(`✗ Error deleting user: ${error.message}`);
            }
        }

        // Load stats on Enter key
        document.getElementById('adminKey').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loadStats();
        });
    </script>
</body>
