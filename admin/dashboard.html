<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEL-STOCK Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .admin-key-input {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-refresh {
            background: #10b981;
            color: white;
        }

        .btn-refresh:hover {
            background: #059669;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .stat-card.users {
            border-left-color: #667eea;
        }

        .stat-card.products {
            border-left-color: #f59e0b;
        }

        .stat-card.sales {
            border-left-color: #10b981;
        }

        .stat-card.revenue {
            border-left-color: #ef4444;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .stat-change {
            font-size: 12px;
            color: #10b981;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #6b7280;
        }

        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        table tbody tr:hover {
            background: #f9fafb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #dc2626;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #22c55e;
            margin-bottom: 20px;
        }

        .chart-container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #6b7280;
        }

        .metric-value {
            font-weight: 600;
            color: #333;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-chart-bar"></i>
                GEL-STOCK Admin Dashboard
            </h1>
            <p style="color: #666; margin-bottom: 15px;">System-wide analytics and user management</p>
            
            <div class="header-controls">
                <input 
                    type="password" 
                    id="adminKey" 
                    class="admin-key-input" 
                    placeholder="Enter admin key to view statistics"
                >
                <button class="btn btn-primary" onclick="loadStats()">
                    <i class="fas fa-unlock"></i> View Dashboard
                </button>
                <button class="btn btn-refresh" onclick="loadStats()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>

        <div id="content"></div>
    </div>

    <script>
        const API_BASE = '../api/';

        async function loadStats() {
            const adminKey = document.getElementById('adminKey').value.trim();
            const content = document.getElementById('content');

            if (!adminKey) {
                content.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> Please enter the admin key</div>';
                return;
            }

            content.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading statistics...</div>';

            try {
                const response = await fetch(`${API_BASE}admin_stats.php?type=all&adminKey=${encodeURIComponent(adminKey)}`);
                const result = await response.json();

                if (!result.success) {
                    content.innerHTML = `<div class="error"><i class="fas fa-lock"></i> ${result.message}</div>`;
                    return;
                }

                displayStats(result.data);
            } catch (error) {
                content.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> Error: ${error.message}</div>`;
            }
        }

        function displayStats(data) {
            let html = '<div class="success"><i class="fas fa-check-circle"></i> Dashboard loaded successfully</div>';

            // User Statistics
            if (data.users) {
                html += `
                    <div class="stats-grid">
                        <div class="stat-card users">
                            <div class="stat-label"><i class="fas fa-users"></i> Total Users</div>
                            <div class="stat-value">${data.users.total_users}</div>
                            <div class="stat-change">
                                <i class="fas fa-arrow-up"></i> ${data.users.registered_today} today
                            </div>
                        </div>
                        <div class="stat-card products">
                            <div class="stat-label"><i class="fas fa-box"></i> Total Products</div>
                            <div class="stat-value">${data.products ? data.products.total_products : 0}</div>
                            <div class="stat-change">
                                Inventory value: GHS ${(data.products ? data.products.total_inventory_value : 0).toLocaleString()}
                            </div>
                        </div>
                        <div class="stat-card sales">
                            <div class="stat-label"><i class="fas fa-shopping-cart"></i> Total Sales</div>
                            <div class="stat-value">${data.sales ? data.sales.total_sales : 0}</div>
                            <div class="stat-change">
                                Avg order: GHS ${(data.sales ? data.sales.average_order_value : 0).toLocaleString()}
                            </div>
                        </div>
                        <div class="stat-card revenue">
                            <div class="stat-label"><i class="fas fa-money-bill-wave"></i> Total Revenue</div>
                            <div class="stat-value">GHS ${(data.revenue ? data.revenue.total_revenue : 0).toLocaleString()}</div>
                            <div class="stat-change">
                                Today: GHS ${(data.revenue ? data.revenue.revenue_today : 0).toLocaleString()}
                            </div>
                        </div>
                    </div>
                `;

                // Recent Registrations
                html += `
                    <div class="section">
                        <h2><i class="fas fa-user-plus"></i> Recent Registrations (Last 100)</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Phone</th>
                                    <th>Email</th>
                                    <th>Registered</th>
                                    <th>Last Login</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.users.recent_registrations.forEach(user => {
                    const regDate = new Date(user.created_at).toLocaleDateString();
                    const lastLogin = user.last_login ? new Date(user.last_login).toLocaleDateString() : 'Never';
                    html += `
                        <tr>
                            <td>${user.name}</td>
                            <td><strong>${user.phone}</strong></td>
                            <td>${user.email}</td>
                            <td>${regDate}</td>
                            <td>${lastLogin}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // Sales Statistics
            if (data.sales && data.sales.sales_by_payment_method) {
                html += `
                    <div class="section">
                        <h2><i class="fas fa-credit-card"></i> Sales by Payment Method</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Payment Method</th>
                                    <th>Number of Sales</th>
                                    <th>Total Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.sales.sales_by_payment_method.forEach(method => {
                    html += `
                        <tr>
                            <td><strong>${method.payment_method.toUpperCase()}</strong></td>
                            <td>${method.count}</td>
                            <td>GHS ${parseFloat(method.total).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // Products by Category
            if (data.products && data.products.products_by_category) {
                html += `
                    <div class="section">
                        <h2><i class="fas fa-tags"></i> Products by Category</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th>Number of Products</th>
                                    <th>Total Stock</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.products.products_by_category.forEach(cat => {
                    html += `
                        <tr>
                            <td><strong>${cat.category}</strong></td>
                            <td>${cat.count}</td>
                            <td>${cat.total_stock} units</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // Top Products
            if (data.products && data.products.top_products) {
                html += `
                    <div class="section">
                        <h2><i class="fas fa-fire"></i> Top 10 Popular Products</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Product Name</th>
                                    <th>SKU</th>
                                    <th>Users with this Product</th>
                                    <th>Avg Stock</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.products.top_products.forEach(product => {
                    const avgStock = (product.stock_quantity / product.users_with_product).toFixed(0);
                    html += `
                        <tr>
                            <td><strong>${product.product_name}</strong></td>
                            <td>${product.sku}</td>
                            <td>${product.users_with_product} users</td>
                            <td>${avgStock} units</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // Activity Statistics
            if (data.activity) {
                html += `
                    <div class="section">
                        <h2><i class="fas fa-chart-line"></i> System Activity (Last 24 Hours)</h2>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-users-cog"></i> Active Users</span>
                            <span class="metric-value">${data.activity.users_active_last_24h}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-plus-square"></i> Product Adders</span>
                            <span class="metric-value">${data.activity.product_adders_24h}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-cash-register"></i> Sellers</span>
                            <span class="metric-value">${data.activity.sellers_24h}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-user-friends"></i> New Users (Week)</span>
                            <span class="metric-value">${data.activity.new_users_last_week}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-user-friends"></i> New Users (Month)</span>
                            <span class="metric-value">${data.activity.new_users_last_month}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label"><i class="fas fa-database"></i> Database Size</span>
                            <span class="metric-value">${data.activity.database_size_mb} MB</span>
                        </div>
                    </div>
                `;
            }

            document.getElementById('content').innerHTML = html;
        }

        // Load stats on Enter key
        document.getElementById('adminKey').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loadStats();
        });
    </script>
</body>
</html>
